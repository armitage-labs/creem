name: Update Homebrew

on:
  workflow_call:
    inputs:
      version:
        description: Published stable CLI version
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Already-published stable CLI version to retry (e.g. 0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-release
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'armitage-labs/creem' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check automation credentials
        env:
          APP_ID: ${{ vars.HOMEBREW_APP_ID }}
          APP_KEY: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo '::error::Configure HOMEBREW_APP_ID and HOMEBREW_APP_PRIVATE_KEY in the release environment. See docs/homebrew-releases.md.'
            exit 1
          fi

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: armitage-labs
          repositories: homebrew-creem
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v4
        with:
          repository: armitage-labs/homebrew-creem
          ref: main
          path: homebrew-tap
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - name: Verify npm artifact and update formula
        id: formula
        env:
          CLI_VERSION: ${{ inputs.version }}
        run: node scripts/update-homebrew.mjs "$CLI_VERSION" homebrew-tap/Formula/creem.rb

      - name: Open or update release PR
        if: steps.formula.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app.outputs.token }}
          path: homebrew-tap
          base: main
          branch: automation/creem-${{ steps.formula.outputs.version }}
          add-paths: Formula/creem.rb
          commit-message: "chore: update creem to ${{ steps.formula.outputs.version }}"
          title: "chore: update creem to ${{ steps.formula.outputs.version }}"
          body: |
            Update Homebrew to the published `@creem_io/cli@${{ steps.formula.outputs.version }}` npm artifact.

            The monorepo verified npm package identity and integrity and calculated the tarball SHA-256.
            Homebrew CI must install, audit, and test this formula before the tap's release automation merges it.

            Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Report update
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "Homebrew update: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Homebrew already has this release or a newer one.' >> "$GITHUB_STEP_SUMMARY"
          fi
