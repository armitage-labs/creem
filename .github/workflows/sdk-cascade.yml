name: SDK Version Cascade

# Runs AFTER the Release workflow completes, not on the push itself.
# creem is published to npm by Release (`changeset publish`) on the same
# push that bumps packages/sdk/package.json, so triggering on push
# raced the publish and `pnpm install` failed on the not-yet-published
# version. Release can also defer publishing to a "version packages" PR
# when other changesets are pending; the npm gate below exits cleanly in
# that case and the cascade re-runs after the next Release.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch: {}

jobs:
  cascade:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Every run writes the same branch. A run that started from an older main
    # must not finish last and push an older version over a newer one. On the
    # job, not the workflow, so a run whose job is skipped (a failed Release)
    # cannot cancel a real cascade.
    concurrency:
      group: sdk-cascade
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Get new SDK version
        id: sdk
        run: echo "version=$(jq -r .version packages/sdk/package.json)" >> $GITHUB_OUTPUT

      # Convex uses workspace:^ only as a local devDependency. Its published peer
      # range is a compatibility floor and is raised manually when the integration
      # requires newer SDK behavior, so it is deliberately excluded here.
      - name: Check if adaptors need updating
        id: check
        run: |
          SDK_VERSION="${{ steps.sdk.outputs.version }}"
          NEEDS_UPDATE=false
          for pkg in packages/integrations/better-auth packages/integrations/nextjs packages/ingestion; do
            CURRENT=$(jq -r '.dependencies.creem // empty' "$pkg/package.json")
            if [ "$CURRENT" != "workspace:^${SDK_VERSION}" ]; then
              NEEDS_UPDATE=true
              break
            fi
          done
          echo "needs_update=$NEEDS_UPDATE" >> $GITHUB_OUTPUT

      # main already depends on the current SDK (bumped by hand, or the cascade
      # pull request was merged), so an open cascade pull request is stale.
      - name: Close a stale cascade pull request
        if: steps.check.outputs.needs_update == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh pr list --head chore/sdk-cascade --base main --state open --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          if [ -n "$number" ]; then
            gh pr close "$number" --delete-branch --comment "main already depends on creem@${{ steps.sdk.outputs.version }}, so this pull request is no longer needed."
          fi

      # Release publishes creem, but when other changesets are pending it
      # opens a version PR instead of publishing. Poll briefly to absorb
      # registry read lag, then skip (green) if the version isn't out yet —
      # merging the version PR triggers Release again, which re-runs this.
      - name: Check SDK version is on npm
        id: npm
        if: steps.check.outputs.needs_update == 'true'
        run: |
          SDK_VERSION="${{ steps.sdk.outputs.version }}"
          for i in $(seq 1 10); do
            if [ "$(npm view "creem@${SDK_VERSION}" version 2>/dev/null)" = "$SDK_VERSION" ]; then
              echo "published=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "creem@${SDK_VERSION} not on npm yet (attempt $i/10)"
            sleep 15
          done
          echo "published=false" >> $GITHUB_OUTPUT
          echo "::notice::creem@${SDK_VERSION} is not on npm yet (release likely deferred to a version PR); skipping — cascade re-runs after the next Release."

      - uses: pnpm/action-setup@v4
        if: steps.npm.outputs.published == 'true'

      - uses: actions/setup-node@v4
        if: steps.npm.outputs.published == 'true'
        with:
          node-version: 24
          cache: "pnpm"

      - name: Update adaptor dependencies
        if: steps.npm.outputs.published == 'true'
        run: |
          SDK_VERSION="${{ steps.sdk.outputs.version }}"
          for pkg in packages/integrations/better-auth packages/integrations/nextjs packages/ingestion; do
            jq --arg v "workspace:^${SDK_VERSION}" '.dependencies.creem = $v' "$pkg/package.json" > tmp.json && mv tmp.json "$pkg/package.json"
          done

      - name: Install dependencies
        if: steps.npm.outputs.published == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Validate generated changes
        if: steps.npm.outputs.published == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm check:package-metadata
          pnpm check:repository-contracts

      - name: Create changeset
        if: steps.npm.outputs.published == 'true'
        run: |
          # A fixed name, so a rerun for the same version changes nothing and
          # does not force-push the branch again.
          cat > ".changeset/sdk-cascade.md" << EOF
          ---
          "@creem_io/better-auth": patch
          "@creem_io/nextjs": patch
          "@creem_io/ingestion": patch
          ---

          Bump creem SDK dependency to ${{ steps.sdk.outputs.version }}
          EOF

      # Pull requests opened with GITHUB_TOKEN do not start other workflows.
      # The PR_AUTOMATION_APP_ID variable and PR_AUTOMATION_APP_PRIVATE_KEY
      # secret (shared with openapi-sync.yml) give the pull request its checks;
      # without them, closing and reopening it starts them.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        if: steps.npm.outputs.published == 'true' && vars.PR_AUTOMATION_APP_ID != ''
        with:
          app-id: ${{ vars.PR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.PR_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # Rebuilding the branch on a newer main can change workflow files
          # between the old and the new tip; GitHub refuses that push without it.
          permission-workflows: write

      # One fixed branch, so a newer SDK release updates the open cascade pull
      # request instead of opening another one next to it. The branch is rebuilt
      # from main on every run, so a commit pushed to it by hand is replaced by
      # the next release's bump; fixes for a breaking SDK change belong in their
      # own pull request.
      - name: Create PR
        if: steps.npm.outputs.published == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump adaptor deps to creem@${{ steps.sdk.outputs.version }}"
          title: "chore: bump adaptors to creem@${{ steps.sdk.outputs.version }}"
          branch: chore/sdk-cascade
          body: |
            Auto-generated: bumps `creem` dependency in adaptor and ingestion packages after Speakeasy SDK release to `${{ steps.sdk.outputs.version }}`.

            When merged, the changesets release workflow will publish new patch versions of the adaptors.
