<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1360" viewBox="0 0 1200 1360" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Attribute YouTube video sales with Creem Short Links</title>
<desc id="diagram-desc">A creator already selling through Creem shares a distinct short link in each YouTube video description and pinned comment. Creem records the click, then routes iOS and Android visitors to mintproduct.com/mobile, other UK visitors to mintproduct.com/uk, and everyone else to mintproduct.com. Visitors create an account and buy through Creem. Analytics compare clicks, paid checkouts, conversion rate, and net revenue per video, with audience breakdowns. Mobile rules take priority over country rules. Example metrics are illustrative.</desc>
